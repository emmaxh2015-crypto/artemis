<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 001 — HelloWorld</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container { max-width: 800px; width: 100%; text-align: center; }
    h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .project-id {
      display: inline-block;
      background: rgba(0,212,255,0.15);
      border: 1px solid #00d4ff;
      color: #00d4ff;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }
    .cat-photo {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      border: 3px solid #7b2ff7;
      margin: 20px 0 30px;
      box-shadow: 0 8px 32px rgba(123,47,247,0.3);
    }
    .cat-caption {
      color: #aaa;
      font-style: italic;
      margin-bottom: 30px;
    }
    .message {
      font-size: 1.3rem;
      color: #fff;
      margin: 20px 0;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
      transition: opacity 0.3s;
    }
    .btn:hover { opacity: 0.85; }
    footer {
      margin-top: auto;
      padding-top: 40px;
      color: #666;
      font-size: 0.85rem;
    }
    footer a { color: #00d4ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <span class="project-id">PROJECT ID: 001</span>
    <h1>HelloWorld</h1>
    <p class="message">🐱 This American Shorthair says: Hello, World!</p>

    <img
      src="img/american-shorthair.jpg"
      alt="American Shorthair cat"
      class="cat-photo"
    >
    <p class="cat-caption">An American Shorthair — calm, curious, and curiouser.</p>

    <a href="../index.html" class="btn">← Back to All Projects</a>
  </div>

  <footer>
    <a href="https://github.com/emmaxh2015-crypto/artemis">View on GitHub</a>
  </footer>
</body>
</html>
