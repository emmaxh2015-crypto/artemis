<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container { max-width: 800px; width: 100%; text-align: center; }
    h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .project-id {
      display: inline-block;
      background: rgba(255,107,107,0.15);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }
    .play-btn {
      display: inline-block;
      padding: 20px 48px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d);
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 800;
      margin: 30px 0;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(255,107,107,0.4);
    }
    .play-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    .note {
      color: #888;
      font-size: 0.95rem;
      margin-top: 20px;
      line-height: 1.6;
    }
    footer {
      margin-top: auto;
      padding-top: 40px;
      color: #666;
      font-size: 0.85rem;
    }
    footer a { color: #00d4ff; text-decoration: none; }
    footer a:hover { color: #7b2ff7; }
  </style>
</head>
<body>
  <div class="container">
    <span class="project-id">EXTERNAL PROJECT</span>
    <h1>🎮 Flappy Bird</h1>
    <p class="note">Click the button below to play Flappy Bird in your browser.<br>No download needed!</p>

    <a href="https://flappybird.io/" target="_blank" class="play-btn">▶ Play Now</a>

    <p class="note" style="margin-top: 40px;">
      Use the <strong>spacebar</strong> or <strong>click</strong> to flap.<br>
      Avoid the pipes and see how far you can go! 🐦
    </p>
  </div>

  <footer>
    <a href="../index.html">← Back to All Projects</a>
    &nbsp;|&nbsp;
    <a href="https://github.com/emmaxh2015-crypto/artemis">View on GitHub</a>
  </footer>
</body>
</html>
